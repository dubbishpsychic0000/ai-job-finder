# Production connector configuration — public sources only.
#
# This file deliberately contains no fixture data or example companies.  Sources
# must be public and must respect site terms, robots and rate limits.  Add a
# company/ATS only after its public identifier or careers URL has been verified.

connectors:
  # General web search via Tavily API (replaces DuckDuckGo which blocks automated requests)
  - kind: tavily
    name: tavily_web_search
    mode: real
    enabled: true
    applies_to_countries: ["*"]
    allocation_priority: 100
    results_per_query: 12

  # Direct public ATS listings only. They are independently deduplicated and
  # provide the most reliable route for publicly displayed contact verification.
  - kind: tavily
    name: tavily_official_ats_search
    mode: real
    enabled: true
    official_only: true
    applies_to_countries: ["*"]
    allocation_priority: 95
    results_per_query: 8

  # Moroccan job boards are discovered through indexed pages. The dedicated
  # Emploi-Public adapter below separately checks robots.txt and reads only
  # bounded public listing/detail HTML (never authentication or submission).
  # Disable any source if its terms, robots policy, or availability changes.
  - {kind: tavily, name: tavily_rekrute, mode: real, enabled: true, applies_to_countries: [Morocco], allocation_priority: 80, domains: [rekrute.com], result_source_type: job_board, results_per_query: 8}
  - {kind: tavily, name: tavily_emploi_ma, mode: real, enabled: true, applies_to_countries: [Morocco], allocation_priority: 80, domains: [emploi.ma], result_source_type: job_board, results_per_query: 8}
  - {kind: tavily, name: tavily_amaljob, mode: real, enabled: true, applies_to_countries: [Morocco], allocation_priority: 80, domains: [amaljob.com], result_source_type: job_board, results_per_query: 8}
  - {kind: tavily, name: tavily_anapec, mode: real, enabled: true, applies_to_countries: [Morocco], allocation_priority: 90, domains: [anapec.org], result_source_type: government, results_per_query: 8}
  - {kind: tavily, name: tavily_emploi_public_ma, mode: real, enabled: true, applies_to_countries: [Morocco], allocation_priority: 90, domains: [emploi-public.ma], result_source_type: government, results_per_query: 8}

  # Official public recruitment announcements. This bounded HTML adapter reads
  # only listing and individual detail pages; it never downloads dossiers.
  - kind: emploi_public
    name: emploi_public_ma
    mode: real
    enabled: true
    applies_to_countries: [Morocco]
    allocation_priority: 100
    max_pages: 2
    max_detail_pages: 12
  - {kind: tavily, name: tavily_marocannonces, mode: real, enabled: true, applies_to_countries: [Morocco], allocation_priority: 75, domains: [marocannonces.com], result_source_type: job_board, results_per_query: 8}
  - {kind: tavily, name: tavily_dreamjob, mode: real, enabled: true, applies_to_countries: [Morocco], allocation_priority: 75, domains: [dreamjob.ma], result_source_type: job_board, results_per_query: 8}
  - {kind: tavily, name: tavily_indeed_morocco, mode: real, enabled: true, applies_to_countries: [Morocco], allocation_priority: 80, domains: [ma.indeed.com], result_source_type: job_board, results_per_query: 8}
  - {kind: tavily, name: tavily_bghit_nekhdem, mode: real, enabled: true, applies_to_countries: [Morocco], allocation_priority: 70, domains: [bghit-nekhdem.com], result_source_type: job_board, results_per_query: 8}
  - {kind: tavily, name: tavily_jobzyn, mode: real, enabled: true, applies_to_countries: [Morocco], allocation_priority: 70, domains: [jobzyn.com], result_source_type: job_board, results_per_query: 8}
  - {kind: tavily, name: tavily_moncallcenter, mode: real, enabled: true, applies_to_countries: [Morocco], allocation_priority: 70, domains: [moncallcenter.ma], result_source_type: job_board, results_per_query: 8}

  # Public ATS/company sources. They are intentionally disabled until a real
  # public company identifier is supplied; no placeholder source can emit jobs.
  - kind: greenhouse
    name: greenhouse_boards
    mode: real
    enabled: false
    boards: []                         # public board tokens, e.g. "mycompany"

  - kind: smartrecruiters
    name: smartrecruiters_companies
    mode: real
    enabled: false
    companies: []                      # public company IDs

  - kind: eures
    name: eures_government
    mode: real
    enabled: false
    feeds:
      - "https://eures.europa.eu/search-jobs/result?query={query}&location={location}&format=rss"

  # Government employment portals (spec §14) — public access only (§34); disabled
  # until an operator verifies the current official endpoints.
  - kind: government
    name: uk_dwp_findajob
    mode: real
    enabled: false
    type: rss
    country: "United Kingdom"
    feeds:
      - "https://findajob.dwp.gov.uk/search?q={query}&l={location}&o=rss"

  - kind: government
    name: austria_ams_jobapi
    mode: real
    enabled: false
    type: api
    country: "Austria"
    access_mode: public
    base_url: "https://jobapi.gv.at/solr/jobdata/select?q={query}&start=0&rows=10&wt=json"
    list_path: "response.docs"
    mapping:
      title: "beruf"
      company: "arbeitgeber"
      location: "arbeitsort_staat"
      url: "url"
      external_id: "id"

  # ATS connectors (spec §8): Lever / Workday / iCIMS public APIs — all disabled
  # until an operator configures real company identifiers.
  - kind: lever
    name: lever_companies
    mode: real
    enabled: false
    sites: []                            # Lever site slugs (jobs.lever.co/…)

  - kind: workday
    name: workday_companies
    mode: real
    enabled: false
    companies: []

  - kind: icims
    name: icims_companies
    mode: real
    enabled: false
    hosts: []