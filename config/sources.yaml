# Production connector configuration — public sources only.
#
# This file deliberately contains no fixture data or example companies.  Sources
# must be public and must respect site terms, robots and rate limits.  Add a
# company/ATS only after its public identifier or careers URL has been verified.

connectors:
  - kind: search_engine
    name: public_web_search
    mode: real
    enabled: true
    results_per_query: 12

  # Direct public ATS listings only. They are independently deduplicated and
  # provide the most reliable route for publicly displayed contact verification.
  - kind: search_engine
    name: official_ats_search
    mode: real
    enabled: true
    official_only: true
    results_per_query: 8

  # Moroccan platforms are discovered through their publicly indexed pages;
  # the agent does not scrape or log into these sites. Disable any source
  # independently if its terms, robots policy, or availability changes.
  - {kind: search_engine, name: rekrute, mode: real, enabled: true, domains: [rekrute.com], result_source_type: job_board, results_per_query: 8}
  - {kind: search_engine, name: emploi_ma, mode: real, enabled: true, domains: [emploi.ma], result_source_type: job_board, results_per_query: 8}
  - {kind: search_engine, name: amaljob, mode: real, enabled: true, domains: [amaljob.com], result_source_type: job_board, results_per_query: 8}
  - {kind: search_engine, name: anapec, mode: real, enabled: true, domains: [anapec.org], result_source_type: government, results_per_query: 8}
  - {kind: search_engine, name: emploi_public_ma, mode: real, enabled: true, domains: [emploi-public.ma], result_source_type: government, results_per_query: 8}
  - {kind: search_engine, name: marocannonces, mode: real, enabled: true, domains: [marocannonces.com], result_source_type: job_board, results_per_query: 8}
  - {kind: search_engine, name: dreamjob, mode: real, enabled: true, domains: [dreamjob.ma], result_source_type: job_board, results_per_query: 8}
  - {kind: search_engine, name: indeed_morocco, mode: real, enabled: true, domains: [ma.indeed.com], result_source_type: job_board, results_per_query: 8}
  - {kind: search_engine, name: bghit_nekhdem, mode: real, enabled: true, domains: [bghit-nekhdem.com], result_source_type: job_board, results_per_query: 8}
  - {kind: search_engine, name: jobzyn, mode: real, enabled: true, domains: [jobzyn.com], result_source_type: job_board, results_per_query: 8}
  - {kind: search_engine, name: moncallcenter, mode: real, enabled: true, domains: [moncallcenter.ma], result_source_type: job_board, results_per_query: 8}

  # Public ATS/company sources. They are intentionally disabled until a real
  # public company identifier is supplied; no placeholder source can emit jobs.
  - kind: greenhouse
    name: greenhouse_boards
    mode: real
    enabled: false
    boards: []                         # public board tokens, e.g. "mycompany"

  - kind: smartrecruiters
    name: smartrecruiters_companies
    mode: real
    enabled: false
    companies: []                      # public company IDs

  - kind: eures
    name: eures_government
    mode: real
    enabled: false
    feeds:
      - "https://eures.europa.eu/search-jobs/result?query={query}&location={location}&format=rss"

  # Government employment portals (spec §14) — public access only (§34); disabled
  # until an operator verifies the current official endpoints.
  - kind: government
    name: uk_dwp_findajob
    mode: real
    enabled: false
    type: rss
    country: "United Kingdom"
    feeds:
      - "https://findajob.dwp.gov.uk/search?q={query}&l={location}&o=rss"

  - kind: government
    name: austria_ams_jobapi
    mode: real
    enabled: false
    type: api
    country: "Austria"
    access_mode: public
    base_url: "https://jobapi.gv.at/solr/jobdata/select?q={query}&start=0&rows=10&wt=json"
    list_path: "response.docs"
    mapping:
      title: "beruf"
      company: "arbeitgeber"
      location: "arbeitsort_staat"
      url: "url"
      external_id: "id"

  # ATS connectors (spec §8): Lever / Workday / iCIMS public APIs — all disabled
  # until an operator configures real company identifiers.
  - kind: lever
    name: lever_companies
    mode: real
    enabled: false
    sites: []                            # Lever site slugs (jobs.lever.co/…)

  - kind: workday
    name: workday_companies
    mode: real
    enabled: false
    companies: []

  - kind: icims
    name: icims_companies
    mode: real
    enabled: false
    hosts: []
