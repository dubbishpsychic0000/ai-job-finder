# Agent behaviour & scoring thresholds. Tune these; the dashboard can override at runtime.

score_thresholds:
  apply: { min: 80, max: 100 }
  investigate: { min: 70, max: 84 }
  hold: { min: 50, max: 69 }
  ignore: { min: 0, max: 49 }

scoring_weights:
  qualification: 0.30
  career: 0.20
  international_fit: 0.20
  sponsorship_potential: 0.15
  relocation_practicality: 0.10
  employer_confidence: 0.05

# Deterministic hard rules (run before AI).
rules:
  tolerance_years_buffer: 2                 # allow candidate exp + buffer vs required
  max_days_since_posted: 45                 # older postings are ignored
  max_daily_applications: 10                # APPLY emails per day
  max_daily_inquiries: 10                   # ASK_EMPLOYER / information requests per day
  max_daily_outbound: 10                    # total outbound emails per day
  employer_cooldown_days: 7                 # cooldown between any contact with the same company
  min_application_score: 80                 # min opportunity score to auto-apply
  min_application_confidence: 0.8           # min agent confidence to auto-apply
  require_contact_for_apply: false          # if true, APPLY is downgraded without a contact email
  follow_up_days: [7, 14, 21]               # follow-up schedule in days after sending
  max_follow_ups_per_application: 2

email:
  max_daily_outbound: 10
  require_verifiable_recipient: true
  require_claims_allowedlist: true          # invention check against candidate profile
  verify_url_before_send: false             # §20 — re-fetch the posting URL before emailing (live)

discovery:
  full_text_description_max_chars: 8000
  results_per_source: 25
  max_per_country: 3                  # role/localized terms kept per country
  max_queries_per_run: 40             # global cap on generated queries per run
  vocab_cache_path: "data/search_vocab_cache.json"
  vocab_llm: false                    # expand roles via LLM (cached on disk)
  source_quality: {}                  # optional per-source-type overrides (§22)
  confidence_boost_per_source: 5      # confidence added per extra source seen (§21/§22)
  confidence_cap: 100
  employer_discovery: false           # build the employer/agency universe (§7/§9) — live web
  employer_targets_per_country: 5
  immigration_discovery: false        # immigration & work-pathway discovery (§11/§13) — live web
  immigration_sources_path: "config/immigration_sources.yaml"
  immigration_facts_per_country: 25
  opportunity_source_discovery: false  # search-engine expansion → opportunity sources (§6) — live web
  opportunity_sources_per_country: 5

search_plan:
  max_combinations_per_country: 3
  freshness_days: 14

scheduler:
  search_cadence_hours: 12
  analysis_cadence_hours: 12
  followup_cadence_hours: 24