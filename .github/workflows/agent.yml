name: Agent 24-7

# Runs the full pipeline (discovery -> analysis -> action) on a schedule,
# keeping all state inside the PRIVATE vault repo. Nothing personal ever
# touches this public repository: candidate data, OAuth secrets and the
# SQLite state are cloned in from the vault at runtime and pushed back.
#
# Secrets required (repo-level, Actions):
#   VAULT_TOKEN      fine-grained PAT (read+write "Contents") for
#                    dubbishpsychic0000/ai-job-finder-vault
#   GEMINI_API_KEYS  comma-separated Gemini API key(s)

on:
  schedule:
    - cron: "13 */2 * * *" # every 2h (UTC)
  workflow_dispatch:
    inputs:
      email_mode:
        description: "Email mode (dry_run never touches Gmail)"
        type: choice
        default: dry_run
        options: [dry_run, draft, live]
      whatsapp_test:
        description: "Send one WhatsApp connection-test template message"
        type: boolean
        default: false

# One run at a time: the agent shares a SQLite DB + global pause control.
concurrency:
  group: agent-24-7
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      LLM_PROVIDER: gemini
      WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
      WHATSAPP_TEMPLATE_NAME: ${{ vars.WHATSAPP_TEMPLATE_NAME }}
      WHATSAPP_TEMPLATE_LANGUAGE: ${{ vars.WHATSAPP_TEMPLATE_LANGUAGE || 'en_US' }}
      WHATSAPP_GRAPH_API_VERSION: ${{ vars.WHATSAPP_GRAPH_API_VERSION || 'v23.0' }}
      # A final workflow step sends exactly one WhatsApp status on every run,
      # including pipeline failures.
      WHATSAPP_RUN_SUMMARY_MANAGED: workflow
      # The agent sends only after the existing verification/safety gate.
      # At its hard daily limit (10), ApplicationEngine switches to Gmail drafts
      # and triggers an immediate WhatsApp alert instead.
      # Real-source rollout: scheduled runs create reviewable Gmail drafts only.
      # A manual dispatch may still explicitly choose live after review.
      EMAIL_MODE: ${{ inputs.email_mode || 'draft' }}
      ENABLE_EMAIL: ${{ (inputs.email_mode || 'draft') != 'dry_run' && 'true' || 'false' }}
      # Lower application thresholds for this debug run so drafts are created
      MIN_APPLICATION_SCORE: 60
      MIN_APPLICATION_CONFIDENCE: 0.5
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore candidate data, OAuth secrets, and state (private vault)
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_URL: https://github.com/dubbishpsychic0000/ai-job-finder-vault.git
        run: |
          # The private vault intentionally contains personal candidate data.
          # Preserve public, versioned V3 defaults when an older vault lacks them.
          mkdir -p /tmp/candidate-defaults
          cp candidate/search_vocabulary.yaml candidate/notification_config.yaml /tmp/candidate-defaults/
          rm -rf /tmp/vault
          git clone --depth 1 "https://x-access-token:${VAULT_TOKEN}@${VAULT_URL#https://}" /tmp/vault
          rm -rf candidate secrets
          mkdir -p candidate secrets data
          cp -a /tmp/vault/candidate/. ./candidate/
          for file in search_vocabulary.yaml notification_config.yaml; do
            test -f "candidate/$file" || cp "/tmp/candidate-defaults/$file" "candidate/$file"
          done
          cp -a /tmp/vault/secrets/. ./secrets/
          cp -a /tmp/vault/state/. ./data/ 2>/dev/null || true

      - name: Run one pipeline pass
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
        run: |
          set +e
          # If the vault included a tavily keys file, export it as TAVILY_API_KEYS for the process
          if [ -f ./secrets/tavily_keys.txt ]; then
            export TAVILY_API_KEYS=$(tr -d '\r' < ./secrets/tavily_keys.txt | paste -sd, -)
            echo "Loaded TAVILY_API_KEYS from ./secrets/tavily_keys.txt"
          fi
          # Ensure debug enabled for verbose Tavily logs
          export TAVILY_DEBUG=1
          python -m app.cli run-once --json > /tmp/run_report.json 2> /tmp/run.log
          echo $? > /tmp/pipeline_exit_code
          cat /tmp/run.log || true
          cat /tmp/run_report.json || true
          exit $(cat /tmp/pipeline_exit_code)

      - name: Send WhatsApp run status
        if: ${{ always() }}
        env:
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from app.notifications.whatsapp import MetaWhatsAppProvider

          exit_code = Path('/tmp/pipeline_exit_code').read_text().strip() if Path('/tmp/pipeline_exit_code').exists() else 'unknown'
          message = f'Career Agent run: FAILED (exit {exit_code}). Check GitHub Actions logs.'
          report_path = Path('/tmp/run_report.json')
          if exit_code == '0' and report_path.exists():
              try:
                  report = json.loads(report_path.read_text(encoding='utf-8'))
                  discovery = report.get('discovery', {})
                  analysis = report.get('analysis', {})
                  action = report.get('action', {})
                  decisions = ', '.join(f'{k} {v}' for k, v in analysis.get('decisions', {}).items()) or 'none'
                  message = (
                      f"Career Agent run complete. Jobs: {discovery.get('new_jobs', 0)} new / "
                      f"{discovery.get('fetched', 0)} fetched. Decisions: {decisions}. "
                      f"Gmail drafts: {action.get('drafts', 0)}. "
                      f"No action: {action.get('applied', 0) == 0 and action.get('asked', 0) == 0}."
                  )
              except (OSError, ValueError, TypeError):
                  message = 'Career Agent run complete, but its report could not be read. Check GitHub Actions logs.'
          provider = MetaWhatsAppProvider()
          if not provider.send(message):
              raise SystemExit('WhatsApp status message was rejected by Meta')
          print(f'WhatsApp accepted by Meta; message id: {provider.last_message_id or "not returned"}')
          PY

      - name: Send WhatsApp connection test
        if: ${{ always() && inputs.whatsapp_test == true }}
        env:
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
        run: |
          python -c "from app.notifications.whatsapp import MetaWhatsAppProvider; import sys; p=MetaWhatsAppProvider(); ok=p.send('WhatsApp connection test: your Worldwide Career Agent is configured and ready.'); print(f'WhatsApp accepted by Meta; message id: {p.last_message_id or \"not returned\"}'); sys.exit(0 if ok else 1)"

      - name: Persist state back to vault
        if: always()
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_URL: https://github.com/dubbishpsychic0000/ai-job-finder-vault.git
        run: |
          rm -f data/test_agent.db data/*.log* data/gemini_result.json data/run_*.json
          rm -rf /tmp/vault
          git clone --depth 1 "https://x-access-token:${VAULT_TOKEN}@${VAULT_URL#https://}" /tmp/vault
          cp -a data/. /tmp/vault/state/
          cd /tmp/vault
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "state: snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no state change"
          git push origin HEAD:main

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-logs
          path: |
            data/*.log
            data/*.log.err
            /tmp/run_report.json
